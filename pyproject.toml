[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vanilla-rag"
version = "0.1.0"
description = "A from-scratch Retrieval-Augmented Generation service: chunking, embeddings, vector search, grounded answers with citations. No framework magic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Portfolio" }]
keywords = ["rag", "retrieval-augmented-generation", "embeddings", "vector-search", "fastapi", "citations"]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "numpy==2.2.1",
    "python-multipart==0.0.20",
    "pypdf==5.1.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers==3.3.1",
    "faiss-cpu==1.9.0.post1",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/CHANGEME/01-vanilla-rag"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
